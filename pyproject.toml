[project]
name = "stt-lab"
version = "0.1.0"
description = "Místní přepis řeči a rozlišení mluvčích"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "gradio==6.24.0",
    "imageio-ffmpeg==0.8.1",
    "librosa==1.0.0",
    "numpy==2.5.2",
    "python-docx==1.2.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "torch==2.13.0",
    "transformers==5.18.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
